appId: com.homegohan.app
name: "Handson Tour - 12: Step 1 で端末の戻るボタン (Android) → 確認なしでツアーを抜けてホームへ"
tags: ["handson-tour", "P2"]
---
# シナリオ: Step 1 で端末の戻るボタン (Back) を押す → 確認のモーダルは出さずに、ツアーを抜けてホームへ
# 確認ポイント:
#   - Step 1 中に Android の戻るボタンを押すと、確認なしで skip (reason hard_back) を送ってホーム (webview-home) へ抜ける
#     (設計書 01-trigger-flow §2.2: Step 1〜3 の端末バックは handson_tour_skipped{reason:'hard_back'} + skipped_at + /home。
#      実装は apps/mobile/app/handson-tour/photo.tsx の handleHardBack → apps/mobile/src/handson-tour/useLeaveTour.ts)
#   - 前の画面 (Step 0 の Welcome) には戻らない
#   - アプリを再起動してもツアーは出ない (handson_tour_skipped_at が付いている)
# 備考: iOS には端末の戻るボタンが無い (Maestro の pressKey: Back が効かない)。戻るボタンの操作と確認は Android だけで流す

- runFlow:
    file: "../_shared/login-as-new-user.yaml"

- assertVisible:
    id: "tour-step-0"

- tapOn:
    id: "tour-step-0-start"

# Step 1 に遷移
- extendedWaitUntil:
    visible:
      id: "meal-camera-button"
    timeout: 10000

- runFlow:
    when:
      platform: Android
    commands:
      # 端末の戻るボタン。確認のモーダルは出さずにホームへ抜ける
      - pressKey: Back

      - extendedWaitUntil:
          visible:
            id: "webview-home"
          timeout: 15000

      - assertNotVisible:
          id: "tour-step-1"
      - assertNotVisible:
          id: "meal-camera-button"
      - assertNotVisible:
          id: "tour-step-0"

      # アプリ再起動後もツアーは表示されない (handson_tour_skipped_at セット)
      - killApp
      - launchApp

      - extendedWaitUntil:
          visible:
            id: "webview-home"
          timeout: 15000

      - assertNotVisible:
          id: "tour-step-0"
