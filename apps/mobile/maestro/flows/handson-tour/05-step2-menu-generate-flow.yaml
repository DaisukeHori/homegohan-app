appId: com.homegohan.app
name: "Handson Tour - 05: Step 2 簡単メニュー生成 → planner バッジ → Step 3"
tags: ["handson-tour", "P1"]
---
# シナリオ: Step 2 の吹き出しを【次へ】【生成する】【次へ】【献立に追加】で進める → planner バッジ → Step 3
# 確認ポイント:
#   - Step 2 の intro 吹き出し (tour-step-2-intro) が出る
#   - 吹き出しの進行ボタン (tour-next-button) で 2.2 → 2.7 まで進められる
#   - planner バッジ獲得通知
#   - Step 3 の tour-step-3-loading が表示される

- runFlow:
    file: "../_shared/login-as-new-user.yaml"

- assertVisible:
    id: "tour-step-0"

- tapOn:
    id: "tour-step-0-start"

# Step 1 を高速通過 (save-button まで)
- waitForAnimationToEnd:
    timeout: 6000

- extendedWaitUntil:
    visible:
      id: "meal-save-button"
    timeout: 15000

- tapOn:
    id: "meal-save-button"

# Step 2 intro 吹き出し (保存が成功してから進む。STEP2_INTRO_AUTO_MS = 2.5 秒で次へ進むので、待たずにすぐ探す)
- extendedWaitUntil:
    visible:
      id: "tour-step-2-intro"
    timeout: 15000

- waitForAnimationToEnd:
    timeout: 4000

# Step 2 のガイドは、吹き出しの進行ボタン (tour-next-button。apps/mobile/src/handson-tour/TourBubble.tsx) で進める
# (apps/mobile/app/handson-tour/menu.tsx: 2.2【次へ】→ 2.3【次へ】→ 2.4【生成する】→ 2.5 読み込み → 2.6【次へ】→ 2.7【献立に追加】)。
# 吹き出しのオーバーレイが下の献立の生成の画面を覆っているので、画面のボタンは押さず、進行ボタンだけを押す

# 2.2 条件の吹き出し →【次へ】
- extendedWaitUntil:
    visible:
      id: "tour-next-button"
    timeout: 10000
- tapOn:
    id: "tour-next-button"

# 2.3 メモの吹き出し →【次へ】
- tapOn:
    id: "tour-next-button"

# 2.4 生成の吹き出し →【生成する】
- extendedWaitUntil:
    visible:
      text: "生成する"
    timeout: 10000
- tapOn:
    id: "tour-next-button"

# 2.5 読み込み (STEP2_LOADING_DURATION_MS) のあと、2.6 結果の吹き出し →【次へ】
- extendedWaitUntil:
    visible:
      text: "次へ"
    timeout: 15000
- tapOn:
    id: "tour-next-button"

# 2.7 追加の吹き出し →【献立に追加】(Step 2 の完了)
- extendedWaitUntil:
    visible:
      text: "献立に追加"
    timeout: 10000
- tapOn:
    id: "tour-next-button"

- waitForAnimationToEnd:
    timeout: 5000

# planner バッジ取得確認
# TODO: badge-card-planner testID は mobile 未実装。テキストマッチで代替
- assertVisible:
    text: "planner"
    optional: true

# Step 3: tour-step-3-loading が表示される
- extendedWaitUntil:
    visible:
      id: "tour-step-3-loading"
    timeout: 15000
