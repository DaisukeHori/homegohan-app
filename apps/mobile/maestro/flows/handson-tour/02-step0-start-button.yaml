appId: com.homegohan.app
name: "Handson Tour - 02: Step 0「はじめる」タップ → Step 1 へ遷移"
tags: ["handson-tour", "critical", "P1"]
---
# シナリオ: Step 0 で「はじめる」タップ → Step 1 へ遷移
# 確認ポイント:
#   - tour-step-0-start タップ後に tour-step-0 が非表示
#   - Step 1 の intro 吹き出し (tour-step-1-intro) が出て、meal-camera-button が表示される

- runFlow:
    file: "../_shared/login-as-new-user.yaml"

- assertVisible:
    id: "tour-step-0"

# 「はじめる」ボタンをタップ
- tapOn:
    id: "tour-step-0-start"

# Step 0 が非表示になる
- assertNotVisible:
    id: "tour-step-0"

# Step 1 の intro 吹き出し (STEP1_INTRO_AUTO_MS = 2.5 秒で次へ進むので、待たずにすぐ探す)
- extendedWaitUntil:
    visible:
      id: "tour-step-1-intro"
    timeout: 10000

# meal-camera-button が Spotlight で表示されることを確認
- assertVisible:
    id: "meal-camera-button"
