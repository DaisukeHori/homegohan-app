appId: com.homegohan.app
name: "Handson Tour - 04: Step 1 写真追加 → first_bite バッジ獲得 → Step 2"
tags: ["handson-tour", "P1"]
---
# シナリオ: Step 1 intro → カメラボタン → 撮影モック → 結果表示 → 保存 → Step 2
# 確認ポイント:
#   - meal-camera-button が Spotlight 表示される
#   - 撮影は sandbox モックなので自動進行 (カメラ不要)
#   - meal-result-dish-name / meal-result-calories が表示される
#   - meal-save-button タップで保存の API (POST /api/meal-plans/add-from-photo) を呼び、成功してから Step 2 へ (#1625)
#     (お試しの記録では first_bite バッジは付かない。設計書 03-step1 §3.9 / #1314)
#   - Step 2 に遷移する (tour-step-2-intro)
# TODO: meal-analyzing-view testID はモバイル未実装 (Web のみ)。別 PR で fix

- runFlow:
    file: "../_shared/login-as-new-user.yaml"

- assertVisible:
    id: "tour-step-0"

# Step 0 を通過
- tapOn:
    id: "tour-step-0-start"

# Step 1: intro 吹き出し (STEP1_INTRO_AUTO_MS = 2.5 秒で次へ進むので、待たずにすぐ探す)
- extendedWaitUntil:
    visible:
      id: "tour-step-1-intro"
    timeout: 10000

# meal-camera-button が Spotlight 表示される
- extendedWaitUntil:
    visible:
      id: "meal-camera-button"
    timeout: 10000

# 撮影モック: sandbox flow では自動的に mock 画像が選択される
# (実機では実際のカメラを開くが sandbox モードでは skip)
# waitForAnimationToEnd で auto-advance を待つ
- waitForAnimationToEnd:
    timeout: 3000

# 解析中ビュー (TODO: meal-analyzing-view testID 確認、存在しない場合は skip)
- waitForAnimationToEnd:
    timeout: 3000

# 結果画面が表示される
- extendedWaitUntil:
    visible:
      id: "meal-result-dish-name"
    timeout: 10000

# 料理名: sandbox mock = 「鶏の唐揚げ定食」
- assertVisible:
    id: "meal-result-dish-name"

# 保存ボタンを Spotlight で示す
- extendedWaitUntil:
    visible:
      id: "meal-save-button"
    timeout: 5000

- tapOn:
    id: "meal-save-button"

# 保存が成功すると (失敗ならエラー画面 tour-step-1-error が出て Step 2 へは進まない。#1625) Step 2 の intro 吹き出しが出る (STEP2_INTRO_AUTO_MS = 2.5 秒で次へ進むので、待たずにすぐ探す)
- extendedWaitUntil:
    visible:
      id: "tour-step-2-intro"
    timeout: 10000
