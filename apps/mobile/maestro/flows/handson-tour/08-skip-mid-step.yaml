appId: com.homegohan.app
name: "Handson Tour - 08: Step 1・Step 2 の途中には【あとで】(tour-skip-button) を出さない"
tags: ["handson-tour", "P1"]
---
# シナリオ: Step 1 と Step 2 の途中では、吹き出しのオーバーレイに【あとで】(tour-skip-button) を出さないことを確かめる
# 確認ポイント:
#   - Step 1 (写真) の途中に tour-skip-button が出ない (apps/mobile/app/handson-tour/photo.tsx は showSkip: false)
#   - Step 2 (献立) の途中に tour-skip-button が出ない (apps/mobile/app/handson-tour/menu.tsx は showSkip={false})
# 備考:
#   - Step 1〜3 の途中でツアーを抜けるのは、端末の戻るボタン (Android) だけ。確かめるのは 12-back-button-during-tour.yaml
#   - 【あとで】でツアーを抜けるのは Step 0 (03-step0-skip-button.yaml) と、Step 1 の保存の失敗のエラー画面 (tour-step-1-error-skip)

- runFlow:
    file: "../_shared/login-as-new-user.yaml"

- assertVisible:
    id: "tour-step-0"

- tapOn:
    id: "tour-step-0-start"

# Step 1: 吹き出しが出ていて、【あとで】は出ていない
- extendedWaitUntil:
    visible:
      id: "meal-camera-button"
    timeout: 10000

- assertVisible:
    id: "tour-step-1"
- assertNotVisible:
    id: "tour-skip-button"

# Step 1 を終える (保存が成功してから Step 2 へ進む)
- extendedWaitUntil:
    visible:
      id: "meal-save-button"
    timeout: 15000

- tapOn:
    id: "meal-save-button"

# Step 2: 吹き出しが出ていて、【あとで】は出ていない
- extendedWaitUntil:
    visible:
      id: "tour-step-2-intro"
    timeout: 15000

- assertNotVisible:
    id: "tour-skip-button"

- extendedWaitUntil:
    visible:
      id: "tour-next-button"
    timeout: 10000

- assertNotVisible:
    id: "tour-skip-button"
