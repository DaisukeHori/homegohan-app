appId: com.homegohan.app
env:
  E2E_USER_EMAIL: ${E2E_USER_01_EMAIL}
  E2E_USER_PASSWORD: ${E2E_USER_01_PASSWORD}
---
# 03-recalculate: 一般の利用者には再計算ボタンを出さず、1 時間ごとに更新されることを案内する (#1406)
# 再計算 (POST /api/comparison/trigger) は super_admin だけが呼べる。集計は 1 時間ごと (毎時 5 分) に pg_cron が走らせる。
# E2E_USER_01 は一般の利用者なので、ボタンは出ない。
- runFlow: ../_shared/login.yaml

# 比較画面へ移動
- tapOn:
    id: "tab-comparison"
- extendedWaitUntil:
    visible:
      id: "comparison-screen"
    timeout: 10000

# 初回ロードを待機
- waitForAnimationToEnd:
    timeout: 10000

# 更新の間隔の案内が出ていて、再計算ボタンは出ていない
- assertVisible:
    id: "comparison-update-schedule"
    text: "ランキングは 1 時間ごとに更新されます。"
- assertNotVisible:
    id: "comparison-recalculate-button"
