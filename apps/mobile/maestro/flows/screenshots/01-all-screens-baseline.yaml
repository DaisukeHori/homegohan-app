appId: com.homegohan.app
env:
  E2E_USER_EMAIL: ${E2E_USER_01_EMAIL}
  E2E_USER_PASSWORD: ${E2E_USER_01_PASSWORD}
---
# 01: レイアウト baseline - タブの画面のスクリーンショット取得
# (お気に入り・週の献立のネイティブの画面は、通常の操作で届かない画面として消した。#1598。週の献立は献立のタブの WebView が出す)
# このフローはビジュアルリグレッション検知の基準画像を作成するために使用します
# 初回実行時は baseline として保存し、以降の変更との差分を比較してください
- runFlow: ../_shared/login.yaml
# ホーム画面
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000
- takeScreenshot: home-baseline
# メニュー画面
- tapOn:
    id: "tab-menus"
- extendedWaitUntil:
    visible:
      id: "menus-screen"
    timeout: 10000
- takeScreenshot: menus-baseline
# 比較画面 (タブは WebView。ネイティブの比較画面 comparison-screen は #1598 で消した)
- tapOn:
    id: "tab-comparison"
- extendedWaitUntil:
    visible:
      id: "webview-comparison"
    timeout: 10000
- takeScreenshot: comparison-baseline
# マイページ (タブは WebView。ネイティブのプロフィール画面 profile-screen は #1598 で消した)
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "webview-profile"
    timeout: 10000
- takeScreenshot: profile-baseline
