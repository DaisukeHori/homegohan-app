name: DB Backup

# 本番 Supabase (flmeolcfutuwwbjmzyoz) の論理バックアップ (#1129 / #1191)。設計は docs/design/cross/17-backup-automation.md。
#
# backup ジョブ (schedule / workflow_dispatch。main だけ):
#   毎日 02:23 JST に本番をダンプし (supabase db dump の roles / schema / data。data は public・auth・storage だけ)、
#   dump では戻らないもの (関数・表・列の権限と storage のポリシー・migration の台帳・cron のジョブの定義) を書庫に足し、
#   age (公開鍵) で暗号化して Cloudflare R2 の daily/ に置く。月曜は weekly/、1 月 1 日は annual/ にも同じ 3 ファイルを送り、
#   ローカルの Supabase に復元して数・カタログ・台帳を確かめる。結果は admin_audit_logs に backup.<層>.<結果> で 1 行ずつ残す。
#   失敗したら report の step が Issue「【自動】DB バックアップの失敗」を作る (成功したら閉じる)。
# roundtrip-check ジョブ (PR / workflow_dispatch。schedule では動かない):
#   ローカルの Supabase をダンプし、空にして戻し、数・カタログ・台帳・cron の定義が同じになることを確かめる (本番に触れない)。
#
# 本番への書き込みは監査行 (public.record_backup_audit) の 1 回の取引だけ。ダンプとカタログの照会は読むだけ。
# 公開リポジトリなので、ログには段の名前・件数・大きさ・ダイジェストの先頭 8 文字だけを出す (scripts/lib/backup-db.mjs の redactForLog)。
# 手順は docs/operations/backup-restore.md (段 D)。本体は scripts/backup-db.mjs と scripts/lib/backup-db.mjs、テストは tests/backup-db.test.ts と
# tests/db-backup-workflow.test.ts。

on:
  schedule:
    # 毎日 02:23 JST (17:23 UTC)。GitHub の schedule は毎時 0 分に遅れるので 0 分・30 分を避ける (BACKUP_SCHEDULE_CRON_UTC)
    - cron: '23 17 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: '取る層 (auto は日付で決める。weekly / annual は daily と一緒。取得の実行中に流すときは auto にする)'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - daily
          - weekly
          - annual
  pull_request:
    paths:
      - 'scripts/backup-db.mjs'
      - 'scripts/lib/backup-db.mjs'
      - 'scripts/supabase-local.sh'
      - '.github/workflows/db-backup.yml'

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ワークフロー直下には concurrency を置かない (PR の run と schedule の run が同じ group に入り、取得が取り消されるため。設計 §4.2)
  backup:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 300                     # JOB_TIMEOUT_MINUTES
    concurrency:
      group: db-backup                       # BACKUP_CONCURRENCY_GROUP (取得どうしだけが入る)
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install age and check tools
        run: sudo apt-get update && sudo apt-get install -y age && age --version && psql --version && python3 --version
      - name: Run backup
        id: run
        timeout-minutes: 290                 # RUN_STEP_TIMEOUT_MINUTES (= 300 - 10。report の step の分を残す)
        run: node scripts/backup-db.mjs run --tier "$TIER_INPUT" --result-file "$RUNNER_TEMP/db-backup-result.json"
        env:
          TIER_INPUT: ${{ inputs.tier || 'auto' }}    # 入力を run: の文字列に直接埋めない (env で渡す)
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_R2_ACCOUNT_ID: ${{ vars.BACKUP_R2_ACCOUNT_ID }}
          BACKUP_R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_DUMP_TIMEOUT_MINUTES: ${{ vars.BACKUP_DUMP_TIMEOUT_MINUTES }}
          BACKUP_UPLOAD_TIMEOUT_MINUTES: ${{ vars.BACKUP_UPLOAD_TIMEOUT_MINUTES }}
          BACKUP_RESTORE_CHECK_TIMEOUT_MINUTES: ${{ vars.BACKUP_RESTORE_CHECK_TIMEOUT_MINUTES }}
          BACKUP_ZSTD_LEVEL: ${{ vars.BACKUP_ZSTD_LEVEL }}
      - name: Stop local Supabase
        if: always()
        run: bash scripts/supabase-local.sh stop || true
      - name: Report (Issue)
        if: always()
        run: node scripts/backup-db.mjs report-issue --result-file "$RUNNER_TEMP/db-backup-result.json" --run-outcome "$RUN_OUTCOME" --run-url "$RUN_URL"
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}               # createGitHub の gh api が読む (GITHUB_REPOSITORY は Actions が自動で入れる)

  roundtrip-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45                      # ROUNDTRIP_JOB_TIMEOUT_MINUTES
    concurrency:
      group: db-backup-roundtrip-${{ github.ref }}   # ROUNDTRIP_CONCURRENCY_GROUP (取得の group に入れない)
      cancel-in-progress: true               # 同じ PR の新しい push が来たら古い往復の検査は要らない
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Roundtrip (local)
        run: node scripts/backup-db.mjs roundtrip-local --slot 0
      - name: Stop local Supabase
        if: always()
        run: bash scripts/supabase-local.sh stop || true
