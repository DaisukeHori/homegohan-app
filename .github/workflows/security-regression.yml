name: security-regression

# 認可 / RLS のセキュリティ回帰テスト (#1231 配下の修正の再発防止) と、
# 運営コンソール (admin / super-admin) API の統合テスト (#849 / #850)。
#
# 本番には接続しない。PR の migration を含むローカル Supabase
# (本番スキーマのベースライン + 本番台帳より新しい migration。scripts/supabase-local.sh)
# とローカルの Next dev サーバに対して、次を実行する:
#   - tests/integration/rls/           supabase-js で PostgREST / RPC を直接叩く RLS・RPC の検証
#   - tests/integration/security/      API ルートを Bearer JWT で叩く越境・権限昇格の検証
#   - tests/integration/handson-tour/  ハンズオンツアーの RPC / API の検証 (#857)。適格性ゲートの 403/409 や
#                                      RPC の EXECUTE 権限、sandbox 行の定期削除 (90 日超) を含む
#   - tests/integration/operator/      運営コンソール API の 200・401・403・400 と副作用の検証
#                                      admin-*.test.ts と auth-boundary.test.ts は /api/admin/*、
#                                      super-admin-*.test.ts は /api/super-admin/* (#850。入力検証は super-admin-input-validation)
#
# 実行するテストは、vitest に渡すパスの文字列 (部分一致) で選んでいる。新しい結合テストを足すときは、
# ファイル名を下の指定に合わせること。当たらないファイルは CI で動かない。
# tests/integration-ci-coverage.test.ts が、動かないファイルが無いことを PR の CI (npm test) で確かめる (#1313)。
#
# 本番には merge 後にしか migration が当たらないため、本番向けの検証では修正 PR 自身が
# merge 前に緑にならない。ローカルスタックで回すことで修正 PR 自身をゲートにできる。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-regression:
    runs-on: ubuntu-latest
    # セキュリティ回帰テスト + 運営コンソールの統合テスト (どちらも直列実行) を 1 つのスタックで回すため長めにとる
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # イメージの取得がレート制限などで失敗したら、取得元を public.ecr.aws → ghcr.io の順に替えてやり直す (#1523)。
      # それでも取れなければ「[image-pull-unavailable] ...」の注記を出して赤で終わる (検査の赤ではない。docs/operations/ci-supabase-image-pull.md)
      - name: Start local Supabase (baseline + new migrations)
        id: supabase
        run: bash scripts/supabase-local.sh start

      - name: Write .env.local for the local stack
        run: bash scripts/supabase-local.sh env .env.local

      # FEATURE_FLAG_CACHE_TTL_MS: 機能フラグの行をメモリに覚える時間 (既定 30 秒) を、この結合テストのサーバーだけ短くする。
      # tests/integration/security/feature-flags-runtime.test.ts が切り替えの反映を待つ時間がこれで決まる
      # (本物の 30 秒を待つと、ON と OFF の 2 回で 1 テストに 1 分以上かかる。#1496)。テストのステップにも同じ値を渡す。
      # 本番 (Vercel) には足さない
      # NEXT_FONT_GOOGLE_MOCKED_RESPONSES: next dev も e2e のビルド (e2e-local.yml) と同じ Google Fonts のモックで、フォントを外へ取りに行かせない。
      # Turbopack の next dev は next/font/google の取得・解決に失敗すると全ページを 500 にし、結合テストが全部赤になる (#1792)。
      # 詳細は tests/e2e/fixtures/google-fonts-mock.cjs。本番 (Vercel) には関係しない
      - name: Start Next dev server
        env:
          FEATURE_FLAG_CACHE_TTL_MS: "2000"
          NEXT_FONT_GOOGLE_MOCKED_RESPONSES: ${{ github.workspace }}/tests/e2e/fixtures/google-fonts-mock.cjs
        run: |
          nohup npm run dev > /tmp/next-dev.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -s -o /dev/null http://localhost:3000/login; then break; fi
            sleep 2
          done
          curl -s -o /dev/null -w 'GET /login -> %{http_code}\n' http://localhost:3000/login
          # next dev は API ルートを初回リクエスト時にコンパイルする (ローカル計測で初回は約 10 秒)。
          # handson-tour のテストが最初のリクエストでテストのタイムアウト (30 秒) に近づかないよう、
          # 認証なしで 1 回ずつ叩いて先にコンパイルさせておく (副作用なし。結果は見ない)
          curl -s -o /dev/null --max-time 120 http://localhost:3000/api/handson-tour/status || true
          for p in /api/handson-tour/skip /api/handson-tour/complete /api/menu-plans/add; do
            curl -s -o /dev/null --max-time 120 -X POST "http://localhost:3000$p" || true
          done

      - name: Run security regression + handson-tour integration tests
        env:
          FEATURE_FLAG_CACHE_TTL_MS: "2000"
        run: >
          npx vitest run --config vitest.integration.config.ts --passWithNoTests
          tests/integration/rls tests/integration/security tests/integration/handson-tour

      # 運営コンソール API の統合テスト: admin (#849) と super_admin 専用 (#850)。
      # 上のセキュリティ回帰テストが落ちた場合も結果が分かるよう、キャンセル時以外は必ず実行する
      # (どちらかが落ちればジョブは失敗)。ただしローカル Supabase が起動できなかったときは実行しない (Supabase の無いまま流れて、
      # 検査の赤に見える失敗を重ねないため。#1523。scripts/local-ci.sh も起動の失敗で段を止める)。--passWithNoTests は付けない (対象が 0 件なら設定ミスとして落とす)。
      # 絞り込みは vitest のパス部分一致。`operator/admin-` は super-admin-*.test.ts に当たらないため、
      # `operator/super-admin-` を別に渡す (tests/integration/operator/ の下は、この 3 つの指定ですべて実行される)。
      # 実行時間は数分で、ジョブの timeout-minutes に対して十分小さいため、ステップは分けない。
      - name: Run operator (admin / super-admin) integration tests
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: >
          npx vitest run --config vitest.integration.config.ts
          tests/integration/operator/admin-
          tests/integration/operator/auth-boundary
          tests/integration/operator/super-admin-

      - name: Show logs on failure
        if: failure()
        run: |
          echo "::group::next dev log"; tail -n 300 /tmp/next-dev.log || true; echo "::endgroup::"
          echo "::group::containers"; docker ps -a || true; echo "::endgroup::"

      - name: Stop local Supabase
        if: always()
        run: bash scripts/supabase-local.sh stop || true
