name: Mobile Tests
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      # モバイルが読む apps/mobile の外のコード。それだけを変える PR でもモバイルの jest を回す (#1574)。
      # packages/shared はパスワードの規則・アカウント変更の文言など、handson-tour-shared は体験ツアー、
      # supabase/functions/_shared は AI の同意・1 日の上限の文など (Web・Edge Functions と共用)。
      # 抜けは tests/mobile-test-workflow-paths.test.ts がモバイルの依存と import から数えて調べる
      - 'packages/shared/**'
      - 'packages/handson-tour-shared/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/mobile-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Mobile unit tests
        working-directory: apps/mobile
        run: npm test -- --ci --coverage
      - name: Core tests
        run: npm run test -- --run packages/core
