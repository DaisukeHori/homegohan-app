name: e2e-local

# PR のコードを、ローカルの Supabase (本番スキーマのベースライン + 新しい migration) と
# 本番ビルド (next build && next start) で動かし、Playwright の MVP スイートを実行する。
# 本番 URL に対して動かす e2e.yml と違い、PR の変更そのものを確かめる。
#
# - テストユーザー (e2e-user-01〜10@homegohan.test) は実行ごとにローカルの DB に作る。
#   パスワードは実行ごとにランダムに作り、ログには出さない (マスクする)。
# - AI を使う 02-meal-photo / 03-ai-advisor は、AI の API キーを持たないため対象外。
#   ai-consent-first-use (外国の AI 事業者への提供の同意、#1154) は、AI に届く場面ではブラウザの通信を差し替え、未同意の場面ではサーバーが
#   AI を呼ぶ前に 403 で止めるので、AI の API キーが無くても動く。対象に入れる。
# - 規約・プライバシーポリシーの再同意ゲート (#1174。legal-consent-gate.spec.ts) は、既定 (3000。強制なし・お知らせなし)、
#   強制あり (3001。LEGAL_CONSENT_ENFORCE=on)、お知らせあり (3002。LEGAL_CONSENT_NOTICE=on) の 3 つのサーバーで確かめる
#   (後ろの手順を参照)。
# - Playwright のトレースと失敗時のページスナップショットは、入力したパスワードを平文で含むため取らない
#   (--trace off / PLAYWRIGHT_NO_COPY_PROMPT=1)。HTML レポートも同じ理由で artifact に上げない。

on:
  pull_request:
    paths:
      - "src/**"
      - "lib/**"
      - "packages/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "supabase/migrations/**"
      - "supabase/baseline/**"
      - "scripts/supabase-local.sh"
      - "scripts/create-e2e-accounts.ts"
      - ".github/workflows/e2e-local.yml"
  workflow_dispatch:

concurrency:
  group: e2e-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      - name: Start local Supabase (baseline + new migrations)
        run: bash scripts/supabase-local.sh start

      - name: Write .env.local for the local stack
        run: bash scripts/supabase-local.sh env .env.local

      - name: Create e2e test users (random password for this run)
        run: |
          PASSWORD="$(openssl rand -hex 16)Aa1!"
          echo "::add-mask::$PASSWORD"
          echo "E2E_USER_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          E2E_USER_PASSWORD="$PASSWORD" npx --yes tsx@4 scripts/create-e2e-accounts.ts

      # 開発サーバー (next dev) はページを初回アクセス時にコンパイルし、HMR の再コンパイルも走るため、
      # ブラウザのテストではタイムアウトや不安定な失敗が出る。本番ビルドで動かす。
      - name: Build and start the app
        env:
          # next/font/google がビルド時に Google Fonts へ取りに行かないようにする (#1330)。
          # GitHub Actions からだと拡張子の無いフォント URL が返ることがあり、Next.js 14 の読み込み処理が
          # TypeError で落ちてビルドが失敗していた。e2e はフォントの見た目に依存しないので、モックで代替フォント表示にする。
          # 詳細は tests/e2e/fixtures/google-fonts-mock.cjs。本番 (Vercel) のビルドには関係しない。
          NEXT_FONT_GOOGLE_MOCKED_RESPONSES: ${{ github.workspace }}/tests/e2e/fixtures/google-fonts-mock.cjs
        run: |
          npm run build
          nohup npm run start > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3000/login; then break; fi
            sleep 2
          done
          curl -s -o /dev/null -w 'GET /login -> %{http_code}\n' http://localhost:3000/login

      # public-policy-pages は未ログインで動く (AI も使わない)。利用規約・プライバシーポリシーが
      # ログイン画面へ飛ばされず読めること (#1174) を、PR のコードの本番ビルドで確かめる。
      - name: Run Playwright tests (MVP, AI を使わないもの + 未ログインで読める公開ページ)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_USER_EMAIL: e2e-user-01@homegohan.test
          E2E_REQUIRE_LOGIN: "1"
          PLAYWRIGHT_NO_COPY_PROMPT: "1"
        run: >
          npx playwright test --trace off
          tests/e2e/01-login.spec.ts
          tests/e2e/04-menu-page.spec.ts
          tests/e2e/05-shopping-list.spec.ts
          tests/e2e/public-policy-pages.spec.ts
          tests/e2e/ai-consent-first-use.spec.ts
          tests/e2e/legal-consent-gate.spec.ts

      # 規約・プライバシーポリシーの再同意ゲート (#1174) の「強制あり」(LEGAL_CONSENT_ENFORCE=on) の挙動は、
      # 同じビルドを on でもう 1 つ別のポート (3001) に起動して確かめる (環境変数はサーバーの起動時に読まれる)。
      # 上のサーバー (3000。どちらのフラグも無し) では、既定の挙動 (お知らせも出さず、誰も止めない)・サインアップ画面・版の表示を確かめた。
      # 上のサーバーを強制ありで起動しないのは、共通のテストユーザー (同意の記録が無い) が同意画面へ回され、01 / 04 / 05 が動かなくなるため。
      - name: Start a second app instance with LEGAL_CONSENT_ENFORCE=on (port 3001)
        env:
          LEGAL_CONSENT_ENFORCE: "on"
        run: |
          nohup npx next start -p 3001 > /tmp/next-start-enforced.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3001/login; then break; fi
            sleep 2
          done
          curl -s -o /dev/null -w 'GET /login (LEGAL_CONSENT_ENFORCE=on) -> %{http_code}\n' http://localhost:3001/login

      - name: Run Playwright tests (consent gate, LEGAL_CONSENT_ENFORCE=on)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          # spec が、強制あり / なしのどちらを確かめるかを決めるために見る (サーバー側と同じ値にする)
          LEGAL_CONSENT_ENFORCE: "on"
          E2E_USER_EMAIL: e2e-user-01@homegohan.test
          PLAYWRIGHT_NO_COPY_PROMPT: "1"
        run: npx playwright test --trace off tests/e2e/legal-consent-gate.spec.ts

      # 「お知らせあり」(LEGAL_CONSENT_NOTICE=on。強制なし) の挙動も、同じビルドを別のポート (3002) に起動して確かめる。
      # 既定ではお知らせを出さないので、3000 のサーバーでは確かめられない。
      - name: Start a third app instance with LEGAL_CONSENT_NOTICE=on (port 3002)
        env:
          LEGAL_CONSENT_NOTICE: "on"
        run: |
          nohup npx next start -p 3002 > /tmp/next-start-notice.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3002/login; then break; fi
            sleep 2
          done
          curl -s -o /dev/null -w 'GET /login (LEGAL_CONSENT_NOTICE=on) -> %{http_code}\n' http://localhost:3002/login

      - name: Run Playwright tests (consent notice, LEGAL_CONSENT_NOTICE=on)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3002
          # spec が、どの検証をするかを決めるために見る (サーバー側と同じ値にする)
          LEGAL_CONSENT_NOTICE: "on"
          E2E_USER_EMAIL: e2e-user-01@homegohan.test
          PLAYWRIGHT_NO_COPY_PROMPT: "1"
        run: npx playwright test --trace off tests/e2e/legal-consent-gate.spec.ts

      - name: Show logs on failure
        if: failure()
        run: |
          echo "::group::next start log"; tail -n 300 /tmp/next-start.log || true; echo "::endgroup::"
          echo "::group::next start log (LEGAL_CONSENT_ENFORCE=on)"; tail -n 300 /tmp/next-start-enforced.log || true; echo "::endgroup::"
          echo "::group::next start log (LEGAL_CONSENT_NOTICE=on)"; tail -n 300 /tmp/next-start-notice.log || true; echo "::endgroup::"
          echo "::group::containers"; docker ps -a || true; echo "::endgroup::"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          # HTML レポート (tests/e2e/.report/) は手順名に fill の入力値 (パスワード) を平文で含むため上げない。
          # 失敗時のスクリーンショット・動画・エラー内容 (tests/e2e/.output/) だけを上げる
          name: playwright-results-local
          path: tests/e2e/.output/
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: bash scripts/supabase-local.sh stop || true
