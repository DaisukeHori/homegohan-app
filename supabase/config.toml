# Supabase local dev / CLI config
# https://supabase.com/docs/reference/cli/config

[functions.knowledge-gpt]
verify_jwt = false

[functions.generate-hint]
verify_jwt = false

# ---------------------------------------------------------------------------
# バッチ専用の Edge Function (#1406)
#
# 次の関数は、先頭で supabase/functions/_shared/auth.ts の requireServiceRole を呼び、
# CRON_SECRET (pg_cron は Vault の app_cron_secret を送る) か service role key の完全一致だけを通す。
# CRON_SECRET はランダムな文字列で JWT ではないため、Supabase のゲートウェイの JWT 検証 (verify_jwt) が
# 有効なままだと、関数に届く前に 401 (UNAUTHORIZED_INVALID_JWT_FORMAT) で止められる。
# pg_net は非同期なので cron.job_run_details は succeeded のままで、失敗が見えない (ENV_SETUP.md の確認手順)。
# そこでゲートウェイの検証を外し、認証は関数の中の requireServiceRole に任せる。
#
# GitHub Actions の「Deploy Supabase Functions」(supabase CLI 2.62.10 の、名前を指定しない functions deploy) は
# この設定を読んで、関数ごとに verify_jwt を設定する (--no-verify-jwt を付けると全関数に効くので付けない)。
# tests/edge-function-verify-jwt.test.ts が、ここの一覧と、関数の先頭の認証と、pg_cron の呼び出し先を突き合わせる。
# 書き方は [functions.<name>] の見出しの下に verify_jwt = false の行だけにする (ほかの書き方はテストが例外にする)。
# ---------------------------------------------------------------------------

# pg_cron のジョブ calculate-segment-stats (public.invoke_calculate_segment_stats) と、POST /api/comparison/trigger
[functions.calculate-segment-stats]
verify_jwt = false

# pg_cron のカタログ取り込み (public.invoke_catalog_import) と、POST /api/admin/catalog/import
[functions.import-seven-eleven-catalog]
verify_jwt = false

[functions.import-familymart-catalog]
verify_jwt = false

[functions.import-lawson-catalog]
verify_jwt = false

[functions.import-natural-lawson-catalog]
verify_jwt = false

[functions.import-ministop-catalog]
verify_jwt = false

# 上の 5 本と同じ取り込み処理 (取り込み元を固定しない版)。リポジトリ内に呼び出し元は無いが、認証は同じ requireServiceRole
[functions.import-convenience-catalog]
verify_jwt = false

# 停止中 (#1325)。認証のあと 410 を返し、呼び出し元が残っている印をログに残す。
# 本番に古い pg_cron のジョブ (app_cron_secret を送る) が残っていたときに、そのログが出るよう関数まで届かせる
[functions.aggregate-org-stats]
verify_jwt = false

# POST /api/super-admin/embeddings/regenerate (service role key)。requireServiceRole なので CRON_SECRET でも呼べる
[functions.regenerate-embeddings]
verify_jwt = false

# POST /api/super-admin/plans/[id]/price-change (service role key)。requireServiceRole なので CRON_SECRET でも呼べる
[functions.stripe-price-sync]
verify_jwt = false
