<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  使い方ガイドの撮影 (#1852) で、Linux の Chromium が日本語を日本語の字形で描くようにする fontconfig の設定。
  run.sh が FONTCONFIG_FILE でこのファイルを Chromium に渡す (macOS の Chromium は fontconfig を使わないので効かない)。
  Ubuntu の既定では sans-serif の日本語に中国語の書体 (WenQuanYi) が選ばれ、一部の漢字が中国語の字形になるため、
  日本語の書体 (IPA P ゴシック。fonts-ipafont-gothic) を先に使う。画面が名前で指す "Noto Sans JP" が端末に無いときも同じ書体にする。
  絵文字 (バッジのアイコン) は Noto Color Emoji のまま。
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>Noto Sans JP</family>
    <prefer><family>IPAPGothic</family></prefer>
  </alias>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>IPAPGothic</string></edit>
  </match>
</fontconfig>
